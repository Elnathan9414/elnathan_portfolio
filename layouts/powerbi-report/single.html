{{ define "main" }}
<section class="py-16 bg-gray-950 text-white min-h-screen">
  <div class="max-w-6xl mx-auto px-6">
    <a href="{{ "/#projects" | relURL }}"
       class="inline-block text-blue-400 hover:underline mb-8">
      Back to projects
    </a>

    <div class="mb-10">
      <h1 class="text-3xl md:text-4xl font-bold mb-4">
        {{ .Title }}
      </h1>
      <p class="text-gray-400 max-w-3xl">
        {{ .Params.description }}
      </p>
    </div>

    {{ with .Params.analysis }}
      <div class="grid md:grid-cols-3 gap-6 mb-10">
        {{ range . }}
          <div class="rounded-xl border border-gray-800 bg-gray-900 p-5">
            <h2 class="text-lg font-semibold mb-3">
              {{ .title }}
            </h2>
            <p class="text-sm text-gray-400 leading-relaxed">
              {{ .text }}
            </p>
          </div>
        {{ end }}
      </div>
    {{ end }}

    <div class="overflow-hidden rounded-xl border border-gray-800 bg-gray-900">
      <iframe title="{{ .Params.reportTitle }}"
              class="w-full h-[541px]"
              src="{{ .Params.reportSrc }}"
              frameborder="0"
              allowFullScreen="true"></iframe>
    </div>
  </div>
</section>
{{ end }}
